spring.application.name=citizentech-java

# Banco H2 em memoria: nao precisa instalar nada. Os dados de teste sao criados ao iniciar (DataLoader).
spring.datasource.url=jdbc:h2:mem:citizentech;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT. Em producao, defina a variavel de ambiente JWT_SECRET (minimo 32 caracteres).
# O valor padrao abaixo e apenas para desenvolvimento local.
citizentech.jwt.secret=${JWT_SECRET:dev-only-secret-citizentech-change-me-0123456789}
citizentech.jwt.expiracao-minutos=120

# CORS para o app Mobile (separe varias origens por virgula)
citizentech.cors.origens=${CORS_ORIGENS:*}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=CitizenTech - Idoso em casa com mais seguranca
info.app.versao=1.0.0
info.app.disciplina=Java Advanced - Global Solution 2026/2

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
